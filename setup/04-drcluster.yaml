# Apply on the ACM Hub cluster.
# s3ProfileName values are auto-generated by MirrorPeer's manageS3 -- find
# the real names before applying:
#   oc get configmap ramen-hub-operator-config -n openshift-operators \
#     -o jsonpath='{.data.ramen_manager_config\.yaml}' | grep s3ProfileName
#
# Note: DRCluster validation calls each site's internal S3 (NooBaa) endpoint
# directly. If that endpoint uses a self-signed certificate, register its
# real router CA in a cluster-wide trust bundle on the Hub (and on both
# spokes, since RamenDR's spoke-side operator makes the same kind of call):
#   oc create configmap spokes-trusted-ca --from-file=ca-bundle.crt=<combined-ca.crt> -n openshift-config
#   oc patch proxy/cluster --type=merge --patch='{"spec":{"trustedCA":{"name":"spokes-trusted-ca"}}}'
apiVersion: ramendr.openshift.io/v1alpha1
kind: DRCluster
metadata:
  name: primary
spec:
  s3ProfileName: s3profile-primary-ocs-storagecluster
---
apiVersion: ramendr.openshift.io/v1alpha1
kind: DRCluster
metadata:
  name: dr
spec:
  s3ProfileName: s3profile-dr-ocs-storagecluster
